name: Update GitHub Stats

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main # Run on push to main to keep stats updated

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to commit back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Script to Generate Stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_github_stats.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github_streak.svg github_contribution_graph.svg
          # Only commit and push if there are changes
          git diff --staged --quiet || (git commit -m "chore: auto-update github stats" && git push)
